<svg viewBox="0 0 220 210" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>TriArk</title>

  <!-- 三つの弧（陸海空）：外・中は色、内は白 -->
  <path d="M10,150 A100,100 0 0,1 210,150" fill="none" stroke="#E8452B" stroke-width="10" stroke-linecap="round"/>
  <path d="M30,150 A80,80 0 0,1 190,150" fill="none" stroke="#00B4C8" stroke-width="10" stroke-linecap="round"/>
  <path d="M50,150 A60,60 0 0,1 170,150" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

  <!-- T 縦幹（白） -->
  <rect x="103" y="18" width="12" height="134" fill="#ffffff" rx="3"/>
  <!-- T 横木（白） -->
  <rect x="55" y="18" width="108" height="10" fill="#ffffff" rx="3"/>

  <!-- ワードマーク（白） -->
  <text x="110" y="192" font-family="Georgia, serif" font-size="24" font-weight="bold" letter-spacing="5" text-anchor="middle" fill="#ffffff">TriArk</text>
  <rect x="56" y="199" width="108" height="2" rx="1" fill="#E8452B"/>
</svg>
