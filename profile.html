<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="page.profile.title">プロフィール — TriArk</title>
<!-- SNSで共有したときに出るカード（Open Graph）。
     これが無いと、Facebook や LINE に貼っても題名も写真も出ない -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="TriArk">
<meta property="og:locale" content="ja_JP">
<meta property="og:title" content="プロフィール — TriArk">
<meta property="og:description" content="旅が、人生になる。乗り物を持っているホストが、自分の旅に人を乗せる。陸・海・空をつなぐ旅のプラットフォームです。">
<meta property="og:url" content="https://triark-chat.web.app/profile.html">
<meta property="og:image" content="https://triark-chat.web.app/images/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="夕暮れの山並みと、光るススキ">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="style.css">
<link rel="apple-touch-icon" href="images/icon-v2-180.png">
<link rel="icon" href="images/icon-v2-64.png" type="image/png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TriArk">
<meta name="theme-color" content="#0B3A5B">
<style>
  /* ============================================================
     プロフィール — ゲストもホストも同じページ
     ・編集（自分）: profile.html
     ・ホストの欄を開いた状態で編集: profile.html?host=1
     ・閲覧（誰でも）: profile.html?uid=xxxx
     ============================================================ */
  body{background:var(--paper);color:var(--ink)}
  .wrap{max-width:760px;margin:0 auto;padding:50px 24px 90px}

  .eyebrow{color:var(--sun)}
  h1{font-size:clamp(28px,5vw,40px);letter-spacing:.05em;margin-bottom:14px;font-weight:700}
  h2{font-size:clamp(21px,3.6vw,26px);letter-spacing:.05em;margin-bottom:10px;font-weight:700}
  .lead{font-size:15px;line-height:2;color:var(--ink-60);margin-bottom:38px}

  .field{margin-bottom:30px}
  .field > label,.field > .label{
    display:block;font-size:12px;letter-spacing:.14em;color:#5d6f7c;margin-bottom:8px;
    font-family:var(--sans);font-weight:600;
  }
  .help{font-size:12px;color:#7d8d99;margin-top:7px;line-height:1.7;font-family:var(--sans)}
  .field input[type=text],.field textarea{
    width:100%;padding:13px 15px;background:#fff;border:1px solid rgba(10,22,34,.18);border-radius:3px;
    color:var(--ink);font-size:15px;font-family:inherit;line-height:1.9;transition:border-color .2s;
  }
  .field textarea{min-height:150px;resize:vertical}
  .field textarea.long{min-height:280px}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--sun)}
  .field input::placeholder,.field textarea::placeholder{color:#9fb0bb}

  /* 写真 */
  .photo-box{display:flex;align-items:center;gap:24px;margin-bottom:36px}
  .avatar-lg{
    width:112px;height:112px;border-radius:50%;flex-shrink:0;
    background:#dfd7cb center/cover no-repeat;display:flex;align-items:center;justify-content:center;
    font:600 40px/1 var(--sans);color:#fff;letter-spacing:0;overflow:hidden;
  }
  .photo-btn{
    display:inline-block;cursor:pointer;border:1.5px solid var(--ink);border-radius:3px;
    padding:9px 18px;font:600 13px/1 var(--sans);letter-spacing:.06em;background:#fff;
  }
  .photo-btn:hover{border-color:var(--sun);color:var(--sun)}
  .link-btn{background:none;border:none;cursor:pointer;color:#7d8d99;font:12px var(--sans);text-decoration:underline;margin-left:12px}
  .photo-note{font-size:12px;color:var(--earth);margin-top:8px;font-family:var(--sans)}

  /* 言語 */
  .lang-rows{display:flex;flex-direction:column;gap:10px}
  .lang-row{
    display:flex;align-items:center;gap:12px;
    padding:10px 14px;background:#fff;border:1px solid rgba(10,22,34,.14);border-radius:3px;
  }
  .lang-row label{
    display:flex;align-items:center;gap:8px;margin:0;min-width:130px;cursor:pointer;
    font-size:14px;color:var(--ink);font-family:var(--sans);
  }
  .lang-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--sun);cursor:pointer}
  .lang-row select{
    flex:1;max-width:200px;padding:7px 10px;border:1px solid rgba(10,22,34,.18);border-radius:3px;
    background:#fff;color:var(--ink);font-size:13px;font-family:var(--sans);cursor:pointer;
  }
  .lang-row select:disabled{opacity:.35;cursor:default}

  /* 好きなこと（選ぶ）＋ 自分の言葉（足す） */
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{
    border:1.5px solid rgba(10,22,34,.2);background:#fff;border-radius:20px;
    padding:8px 16px;font-size:13px;cursor:pointer;color:var(--ink);
    font-family:var(--sans);transition:border-color .18s,background .18s,color .18s;
  }
  .chip.on{border-color:var(--sun);background:var(--sun);color:#fff}
  .tag-box{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;
    padding:9px 10px;background:#fff;border:1px solid rgba(10,22,34,.18);border-radius:3px;
  }
  .tag-box:focus-within{border-color:var(--sun)}
  .tag-box input{flex:1;min-width:160px;border:none !important;padding:5px 4px !important;font-size:14px;font-family:var(--sans)}
  .tag-box input:focus{outline:none}
  .utag{
    display:inline-flex;align-items:center;gap:6px;background:var(--sea);color:#fff;
    border-radius:16px;padding:5px 8px 5px 13px;font:13px var(--sans);
  }
  .utag button{background:none;border:none;color:#fff;cursor:pointer;font-size:15px;line-height:1;opacity:.8;padding:0 3px}
  .utag button:hover{opacity:1}

  .write-note{
    padding:14px 16px;background:rgba(0,180,200,.08);border-left:3px solid var(--cyan);
    font:13px/1.9 var(--sans);color:#42586a;margin:-6px 0 34px;
  }

  /* ホストの欄 */
  .host-sec{border-top:1px solid var(--line);padding-top:44px;margin-top:14px}
  .host-invite{
    border:1px solid var(--line);background:#fff;border-radius:3px;padding:24px;margin:10px 0 36px;
  }
  .host-invite p{font-size:14px;line-height:1.9;color:var(--ink-60);margin:6px 0 16px}
  .btn-line{
    background:#fff;border:1.5px solid var(--sun);color:var(--sun);border-radius:3px;cursor:pointer;
    padding:10px 20px;font:600 14px var(--sans);letter-spacing:.06em;
  }
  .btn-line:hover{background:var(--sun);color:#fff}

  .save{
    background:var(--sun);color:#fff;border:none;border-radius:3px;margin-top:10px;
    padding:14px 40px;font-size:15px;font-weight:600;letter-spacing:.1em;cursor:pointer;
    font-family:var(--sans);transition:opacity .2s;
  }
  .save:hover{opacity:.88}
  .save:disabled{opacity:.5;cursor:default}
  .message{margin-top:16px;font-size:13px;min-height:20px;font-family:var(--sans)}
  .message.ok{color:#1F7A5A}
  .message.error{color:#C0392B}
  .message.info{color:#7d8d99}
  a.textlink{color:var(--sea);text-decoration:underline;font-size:13px;font-family:var(--sans)}
  button.out-btn{background:none;border:none;padding:0;cursor:pointer;
    color:var(--sea);text-decoration:underline;font-size:13px;font-family:var(--sans)}
  button.out-btn:hover{color:var(--sun)}
  a.textlink:hover{color:var(--sun)}

  /* 乗り物と写真 */
  .veh{border:1px solid var(--line);background:#fff;border-radius:3px;padding:16px;margin-bottom:12px}
  .veh-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .veh-head select{padding:8px 10px;border:1px solid rgba(10,22,34,.18);border-radius:3px;background:#fff;font:14px var(--sans)}
  .veh-head input{flex:1;min-width:180px;padding:9px 12px;border:1px solid rgba(10,22,34,.18);border-radius:3px;font-size:14px;font-family:inherit}
  .veh-head .rm{margin-left:auto;background:none;border:none;color:#9aa8b2;font-size:17px;cursor:pointer}
  .veh-head .rm:hover{color:var(--sun)}
  .veh textarea{
    width:100%;padding:9px 12px;border:1px solid rgba(10,22,34,.18);border-radius:3px;
    font-size:13px;font-family:inherit;line-height:1.8;min-height:52px;resize:vertical;
  }
  .ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:12px 0}
  .ph{position:relative;aspect-ratio:4/3;background:#efe9e0;border-radius:2px;overflow:hidden}
  .ph img{width:100%;height:100%;object-fit:contain;display:block}
  .ph button{
    position:absolute;top:4px;right:4px;width:22px;height:22px;border:none;border-radius:50%;
    background:rgba(10,22,34,.65);color:#fff;font-size:13px;line-height:1;cursor:pointer;
  }
  .ph.busy{opacity:.45}
  /* 写真ごとの一言。写真のすぐ下に置いて、どの写真の話か迷わないようにする */
  .ph-item{display:flex;flex-direction:column;gap:6px}
  .ph-item .ph-note{
    width:100%;padding:7px 9px;background:#fff;border:1px solid rgba(10,22,34,.18);border-radius:3px;
    color:var(--ink);font-size:13px;font-family:inherit;line-height:1.6;
  }
  .ph-item .ph-note:focus{outline:none;border-color:var(--sun)}
  .ph-item .ph-note::placeholder{color:#a8b6c0}
  .v-veh{margin-bottom:26px}
  .v-veh .n{font-size:15px;font-weight:600;letter-spacing:.03em}
  .v-veh .k{font:600 11px var(--sans);letter-spacing:.14em;color:var(--earth);margin-bottom:3px}
  .v-veh .note{font-size:13px;color:var(--ink-40);line-height:1.8;margin-top:4px}
  /* 体験の一覧と同じだけ間を空けて、区切りを分かりやすくする */
  #vehSec{margin-top:50px}
  /* Ark の写真は控えめに、3枚ずつ横に。
     大きすぎると、上にある「この人の体験」から目が離れてしまう */
  .v-veh .ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .v-veh .ph-grid .ph{aspect-ratio:4/3;margin:0;border-radius:2px;overflow:hidden;background:#efe9e0}
  .v-veh .ph-grid img{width:100%;height:100%;object-fit:cover;display:block}
  @media(max-width:600px){ .v-veh .ph-grid{grid-template-columns:1fr 1fr} }
  .veh .photo-btn{font-size:12px;padding:7px 14px}

  /* Ark の写真は3枚まで。4枚目からは押して開く。
     写真の下辺いっぱいに置く帯にする。日本語でも英語でも折り返さず、
     はみ出さない。
     ※ 上の「.ph button」（写真を消す丸い×）より後で、より細かく指定する。
        そうしないと、こちらが 22px の丸にされて縦書きのようになる */
  .v-veh .ph-grid .ph{position:relative}
  .v-veh .ph button.more{
    position:absolute;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;z-index:2;
    border:none;border-top:1px solid rgba(244,237,226,.22);border-radius:0;
    background:rgba(6,31,49,.82);color:var(--sand);cursor:pointer;
    padding:9px 8px;font:600 12px/1.4 var(--sans);letter-spacing:.04em;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .v-veh .ph button.more:hover{background:var(--sea)}

  /* ---------- 海の Ark の登録 ----------
     お金をいただいて人を乗せるには、法律で事業の登録が要る。
     船を選んだときだけ、その Ark の箱の中に出す。
     陸は、ガイドに付随する送迎であれば許可も免許も要らないので何も出さない */
  .sea-box.land{border-left-color:var(--earth)}
  .sea-box{
    margin:12px 0;padding:13px 14px;border-radius:3px;
    background:#fbf8f3;border:1px solid var(--line);border-left:3px solid var(--sea);
  }
  .sea-head{
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    font:600 13px var(--sans);letter-spacing:.03em;margin:0 0 10px;
  }
  .sea-state{font:600 11px var(--sans);letter-spacing:.08em;padding:2px 8px;border-radius:10px}
  .sea-state.todo{background:#efe7dc;color:#8a7c6b}
  .sea-state.done{background:var(--sea);color:#fff}
  .sea-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
  .sea-row select,.sea-row input{
    padding:8px 11px;border:1px solid rgba(10,22,34,.18);border-radius:3px;
    font:14px var(--sans);background:#fff;
  }
  .sea-row select{flex:0 1 240px;min-width:0}
  .sea-row input{flex:1 1 200px;min-width:0}
  .sea-label{font-size:13px;color:var(--ink-40);flex:0 0 auto}
  .sea-check{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.7;margin-top:4px}
  .sea-check input{margin-top:3px;flex:0 0 auto}
  .sea-note{margin:10px 0 0;font-size:11.5px;line-height:1.9;color:var(--ink-40)}
  .cert-check{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.7}
  .cert-check input{margin-top:3px;flex:0 0 auto}


  /* 閲覧側 */
  .v-cert{
    display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;
    padding:11px 0;border-bottom:1px solid var(--line);
  }
  .v-cert:last-of-type{border-bottom:none}
  .v-cert .k{font-size:14px;font-weight:600;letter-spacing:.02em;flex:0 0 auto}
  .v-cert .no{font:13px var(--sans);color:var(--ink-40);letter-spacing:.02em}
  .v-cert .exp{font:12px var(--sans);color:var(--ink-40);margin-left:auto;white-space:nowrap}
  .cert-disclaimer{
    margin-top:16px;font-size:11.5px;line-height:1.9;color:var(--ink-40);
  }

  /* 目次。押すと、その欄まで画面が動く。
     広い画面 … 左の余白に、縦に並べる
     狭い画面 … 上の帯のすぐ下に貼り付いて、横に並べる
     どちらも同じ中身。作るのは buildSideNav() ひとつ */
  .side-nav{display:none}

  /* --- 狭い画面：横に並ぶ小さな札 --- */
  @media(max-width:1179px){
    .side-nav{
      display:flex;gap:8px;position:sticky;top:58px;z-index:40;
      margin:0 -24px 22px;padding:10px 24px;
      background:var(--paper);border-bottom:1px solid var(--line);
      overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    }
    .side-nav::-webkit-scrollbar{display:none}
    .side-nav a{
      flex:0 0 auto;padding:7px 14px;border-radius:16px;
      border:1px solid rgba(10,22,34,.16);background:#fff;
      font:13px/1.4 var(--sans);color:var(--ink-40);text-decoration:none;white-space:nowrap;
    }
    .side-nav a.on{border-color:var(--sun);background:var(--sun);color:#fff;font-weight:600}
  }
  @media(max-width:600px){
    .side-nav{margin:0 -20px 20px}
  }

  /* --- 広い画面：左の余白に縦に並べる --- */
  @media(min-width:1180px){
    .side-nav{
      display:block;position:fixed;top:50%;transform:translateY(-50%);
      left:calc(50% - 380px - 216px);width:196px;z-index:50;
    }
    .side-nav a{
      display:block;padding:10px 0 10px 14px;border-left:2px solid transparent;
      font:15px/1.6 var(--sans);color:var(--ink-40);text-decoration:none;
      transition:color .2s,border-color .2s;
    }
    .side-nav a:hover{color:var(--sun)}
    .side-nav a.on{color:var(--sea);border-left-color:var(--sun);font-weight:600}
  }
  /* 押して動いたとき、上の帯や目次に見出しが隠れないようにする */
  #viewListings,#vehSec,#certSec{scroll-margin-top:84px}
  @media(max-width:1179px){ #viewListings,#vehSec,#certSec{scroll-margin-top:118px} }

  /* 翻訳の確認 */
  .tr-box{margin-top:40px;border:1px solid var(--line);background:#fff;border-radius:3px;padding:20px 22px}
  .tr-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font:600 12px var(--sans);letter-spacing:.14em;color:#5d6f7c}
  .tr-head select{padding:5px 9px;border:1px solid rgba(10,22,34,.18);border-radius:3px;background:#fff;font:13px var(--sans);cursor:pointer}
  .tr-head .link-btn{margin-left:0}
  .tr-item{margin-top:16px}
  .tr-item .k{font:600 11px var(--sans);letter-spacing:.14em;color:var(--earth);margin-bottom:5px}
  .tr-item .v{font-size:14px;line-height:1.9;white-space:pre-wrap;color:#42586a}
  .tr-empty{margin-top:14px;font:13px var(--sans);color:#8c9aa6}
  /* 自分で訳を直せるようにする */
  .tr-item textarea{
    width:100%;padding:10px 12px;background:#fff;border:1px solid rgba(10,22,34,.18);border-radius:3px;
    color:#42586a;font-size:14px;font-family:inherit;line-height:1.9;min-height:70px;resize:vertical;
  }
  .tr-item textarea:focus{outline:none;border-color:var(--sun)}
  .tr-tags{display:flex;flex-wrap:wrap;gap:8px}
  .tr-tags input{
    padding:7px 11px;background:#fff;border:1px solid rgba(10,22,34,.18);border-radius:16px;
    color:#42586a;font:13px var(--sans);width:auto;min-width:90px;
  }
  .tr-tags input:focus{outline:none;border-color:var(--sun)}
  .tr-foot{margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .tr-foot .btn-line{padding:9px 18px;font:600 13px var(--sans)}

  /* 閲覧 */
  .v-head{display:flex;align-items:center;gap:24px;margin-bottom:26px}
  .v-head h1{margin-bottom:4px}
  .view-headline{font-size:clamp(18px,3vw,22px);line-height:1.7;color:var(--sea)}
  .view-meta{font-size:13px;color:#6b7d8a;margin-bottom:22px;font-family:var(--sans);letter-spacing:.04em;line-height:1.9}
  .v-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:36px}
  .v-tags span{font-size:12px;padding:5px 12px;border-radius:14px;background:rgba(11,58,91,.08);color:var(--sea);font-family:var(--sans)}
  .v-tags span.own{background:var(--sea);color:#fff}
  .v-sec{margin-bottom:40px}
  .v-sec h3{font:600 12px var(--sans);letter-spacing:.2em;color:var(--earth);margin-bottom:12px}
  .view-text{font-size:16px;line-height:2.2;white-space:pre-wrap}
  .fallback-note{display:inline-block;margin-top:8px;font-size:11px;color:#8c9aa6;font-family:var(--sans);letter-spacing:.06em}

  .mini-card{
    display:flex;gap:16px;align-items:center;background:#fff;
    border:1px solid rgba(10,22,34,.12);border-radius:3px;padding:14px;margin-bottom:12px;
    text-decoration:none;color:inherit;transition:border-color .2s;
  }
  .mini-card:hover{border-color:var(--sun)}
  .mini-card .mc-img{width:92px;height:68px;background:#dfd7cb center/cover no-repeat;flex-shrink:0;border-radius:2px}
  .mini-card .mc-title{font-size:16px;line-height:1.5;margin-bottom:5px}
  .mini-card .mc-meta{font-size:12px;color:#6b7d8a;font-family:var(--sans)}

  .hidden{display:none !important}

  @media(max-width:600px){
    .wrap{padding:34px 20px 70px}
    .photo-box,.v-head{gap:18px}
    .avatar-lg{width:88px;height:88px;font-size:32px}
    .field textarea.long{min-height:230px}
  }
</style>
</head>
<body>

  <header class="site-header" id="siteHeader"></header>
  <script src="header.js"></script>

  <div class="wrap">

    <!-- ================= 編集（自分） ================= -->
    <div id="editMode" class="hidden">
      <p class="eyebrow">PROFILE</p>
      <h1 data-i18n="profile.title">プロフィール</h1>
      <p class="lead" data-i18n="profile.lead"></p>

      <!-- 写真はいちばん上 -->
      <div class="photo-box">
        <div class="avatar-lg" id="avatarPreview"></div>
        <div>
          <label class="photo-btn" for="photoFile" id="photoBtn" data-i18n="profile.photoPick">写真を選ぶ</label>
          <button type="button" class="link-btn hidden" id="photoRemove" data-i18n="profile.photoRemove">写真を外す</button>
          <input type="file" id="photoFile" accept="image/*" hidden>
          <p class="help" data-i18n="profile.photoHelp2"></p>
          <p class="photo-note hidden" id="photoNote" data-i18n="profile.photoPending"></p>
        </div>
      </div>

      <div class="field">
        <label for="name" data-i18n="profile.name">名前</label>
        <input type="text" id="name" data-max="30" autocomplete="name">
        <p class="help" data-i18n="profile.nameHelp"></p>
      </div>

      <div class="field">

<script src="i18n.js"></script>

<script type="module">
  import { app, db, onUser, getUser, logOut } from './auth.js';
  import {
    doc, getDoc, setDoc, updateDoc, serverTimestamp, deleteField,
    collection, query, where, getDocs
  } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
  import {
    getStorage, ref as storageRef, uploadBytes, getDownloadURL
  } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-storage.js";

  const storage = getStorage(app);
  const t = (k) => TriArk.i18n.t(k);
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  const LANG_CODES = ['ja','en','zh','ko','fr','es'];
  const LEVELS = ['native','fluent','business','conversational','beginner'];
  const INTERESTS = ['music','film','manga','books','fishing','hiking','camping','trains',
    'cars','photography','food','onsen','sake','cafe','history','art','nature','stars',
    'cycling','surfing','snow','crafts','games','language'];
  const TAG_MAX = 10;        // 自分で足せるキーワードの数
  const TAG_LEN = 20;        // 1つあたりの文字数

  const params  = new URLSearchParams(location.search);
  const viewUid = params.get('uid');
  const wantHost = params.get('host') === '1';

  let tags = [];             // 自分で足したキーワード
  let photoBlob = null;      // 選んだ写真（保存するまでは手元に置いておく）
  let photoURL = '';         // 保存されている写真の URL
  let hostOpen = false;      // ホストの欄を開いているか
  let wasHost = false;

  /* ============================================================
     共通：丸い顔写真（写真がなければ名前の頭文字）
     ============================================================ */
  function paintAvatar(box, url, name) {
    if (url) {
      box.style.backgroundImage = 'url("' + url.replace(/"/g, '%22') + '")';
      box.style.backgroundColor = '';
      box.textContent = '';
    } else {
      box.style.backgroundImage = '';
      box.style.backgroundColor = '#8FA6B5';
      box.textContent = (String(name || '').trim().charAt(0) || '·').toUpperCase();
    }
  }

  function show(id) {
    ['editMode','viewMode','notFound'].forEach(m => el(m).classList.toggle('hidden', m !== id));
  }
  function message(key, kind) {
    el('message').textContent = key ? t(key) : '';
    el('message').className = 'message ' + (kind || '');
  }

  /* ============================================================
     編集：言語
     ============================================================ */
  function toLangMap(raw) {
    if (!raw) return {};
    return Array.isArray(raw) ? raw.reduce((o, c) => (o[c] = 'fluent', o), {}) : raw;
  }
  function buildLangChecks(current) {
    const langs = toLangMap(current);
    el('langChecks').innerHTML = LANG_CODES.map(code =>
      '<div class="lang-row">' +
        '<label><input type="checkbox" value="' + code + '" data-role="on"' + (langs[code] ? ' checked' : '') + '>' +
        '<span data-i18n="lang.' + code + '">' + t('lang.' + code) + '</span></label>' +
        '<select data-level="' + code + '"' + (langs[code] ? '' : ' disabled') + '>' +
          LEVELS.map(lv => '<option value="' + lv + '"' + (langs[code] === lv ? ' selected' : '') +
            ' data-i18n="level.' + lv + '">' + t('level.' + lv) + '</option>').join('') +
        '</select>' +
      '</div>'
    ).join('');
    el('langChecks').querySelectorAll('input[data-role=on]').forEach(cb => {
      cb.addEventListener('change', () => {
        el('langChecks').querySelector('select[data-level="' + cb.value + '"]').disabled = !cb.checked;
      });
    });
  }

  /* ============================================================
     編集：好きなこと（選ぶ）と、自分の言葉（足す）
     ============================================================ */
  function buildInterests(selected) {
    const on = selected || [];
    el('interestChips').innerHTML = INTERESTS.map(code =>
      '<button type="button" class="chip' + (on.includes(code) ? ' on' : '') +
      '" data-code="' + code + '" data-i18n="interest.' + code + '">' + t('interest.' + code) + '</button>'
    ).join('');
    el('interestChips').querySelectorAll('.chip').forEach(b =>
      b.addEventListener('click', () => b.classList.toggle('on')));
  }

  function renderTags() {
    el('tagBox').querySelectorAll('.utag').forEach(n => n.remove());
    const input = el('tagInput');
    tags.forEach((tg, i) => {
      const s = document.createElement('span');
      s.className = 'utag';
      s.innerHTML = esc(tg) + '<button type="button" aria-label="remove">×</button>';
      s.querySelector('button').addEventListener('click', () => { tags.splice(i, 1); renderTags(); });
      el('tagBox').insertBefore(s, input);
    });
    input.disabled = tags.length >= TAG_MAX;
    el('tagHelp').textContent = t(tags.length >= TAG_MAX ? 'profile.tagsFull' : 'profile.tagsHelp');
  }
  function addTag(raw) {
    const v = String(raw || '').replace(/[,、，]/g, ' ').trim().slice(0, TAG_LEN);
    if (!v) return;
    if (tags.length >= TAG_MAX) return;
    if (tags.some(x => x.toLowerCase() === v.toLowerCase())) return;   // 同じものは足さない
    tags.push(v);
    renderTags();
  }
  el('tagInput').addEventListener('keydown', (e) => {
    // 日本語の変換中の Enter は「確定」なので、ここでは拾わない
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter' || e.key === ',' || e.key === '、') {
      e.preventDefault();
      addTag(e.target.value);
      e.target.value = '';
    } else if (e.key === 'Backspace' && !e.target.value && tags.length) {
      tags.pop(); renderTags();
    }
  });
  // 入力したまま保存ボタンを押した場合も、取りこぼさない
  el('tagInput').addEventListener('blur', (e) => { addTag(e.target.value); e.target.value = ''; });

  /* ============================================================
     編集：写真
     ・選んだ時点で正方形に切り抜き、512px の JPEG に縮めて手元に置く
     ・アップロードは「保存する」を押したとき
     ============================================================ */
  async function squareJpeg(file, size) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();                     // 読めない形式（HEIC など）はここで失敗する
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      const sx = (img.naturalWidth - s) / 2;
      const sy = (img.naturalHeight - s) / 2;
      const out = Math.min(size, s);
      const c = document.createElement('canvas');
      c.width = c.height = out;
      c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, out, out);
      return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.85));
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  el('photoFile').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      photoBlob = await squareJpeg(file, 512);
      if (!photoBlob) throw new Error('toBlob failed');
      paintAvatar(el('avatarPreview'), URL.createObjectURL(photoBlob), el('name').value);
      el('photoNote').classList.remove('hidden');
      el('photoRemove').classList.remove('hidden');
      message('', '');
    } catch (err) {
      console.error(err);
      photoBlob = null;
      message('profile.photoFormat', 'error');
    }
  });
  el('photoRemove').addEventListener('click', () => {
    photoBlob = null;
    photoURL = '';
    paintAvatar(el('avatarPreview'), '', el('name').value);
    el('photoRemove').classList.add('hidden');
    el('photoNote').classList.remove('hidden');
  });

  /* ============================================================
     編集：乗り物と、旅の様子の写真
     ・体験ごとに入れ直さなくて済むよう、ホストのプロフィールに一度だけ置く
     ・写真は選んだ時点でアップロードし、URL を持っておく
     ============================================================ */
  const VEH_TYPES = ['land', 'sea', 'air'];
  const VEH_MAX = 5, VEH_PHOTOS = 6, GAL_MAX = 12;

  const NOTE_LEN = 60;   // 写真にそえる一言の長さ
  let vehicles = [];     // [{ type, name, note, photos:[url] }]
  let gallery  = [];     // どの体験にも出す写真 [url]
  let galNotes = [];     // gallery と同じ並びの一言メモ

  /* 長い辺を 1600px までに縮めた JPEG にする */
  async function wideJpeg(file, max) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * scale);
      const h = Math.round(img.naturalHeight * scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.82));
    } finally { URL.revokeObjectURL(url); }
  }

  async function uploadPhoto(file) {
    const user = getUser();
    if (!user) return null;
    const blob = await wideJpeg(file, 1600);
    if (!blob) return null;
    const path = 'users/' + user.uid + '/photos/' + Date.now() + '-' +
                 Math.random().toString(36).slice(2, 7) + '.jpg';
    const r = storageRef(storage, path);
    await uploadBytes(r, blob, { contentType: 'image/jpeg' });
    return await getDownloadURL(r);
  }

  /* 写真を選んだときの共通処理。1枚ずつ上げて、上がったものから並べる */
  async function takePhotos(files, list, max, redraw) {
    const room = max - list.length;
    const picked = files.slice(0, Math.max(0, room));
    if (!picked.length) { message('veh.full', 'error'); return; }
    message('veh.uploading', 'info');
    for (const f of picked) {
      try {
        const url = await uploadPhoto(f);
        if (url) { list.push(url); redraw(); }
      } catch (e) {
        console.error('[profile] 写真のアップロードに失敗', e);
        message('profile.photoFailed', 'error');
        return;
      }
    }
    message('veh.uploaded', 'ok');
  }

  function photoGrid(urls) {
    return urls.map((u, i) =>
      '<div class="ph" data-full="' + esc(u) + '">' +
        '<img src="' + esc(u) + '" alt="" loading="lazy">' +
        '<button type="button" data-i="' + i + '" aria-label="remove">×</button>' +
      '</div>').join('');
  }

  /* その Ark に要るものを、Ark の箱の中に出す。
     ・海 … お金をいただいて人を乗せるには事業の登録が要る（海上運送法・遊漁船業法）
     ・陸 … 許可も免許も要らない形で設計しているので、保険の確認だけ
     ・空 … 準備中 */
  function arkBox(v) {
    if (v.type === 'land') {
      return '<div class="sea-box land">' +
        '<p class="sea-head">' + esc(t('cert.insTitle')) + '</p>' +
        '<label class="sea-check">' +
          '<input type="checkbox" data-f="carInsOk"' + (v.carInsOk ? ' checked' : '') + '>' +
          '<span>' + esc(t('cert.insConfirm')) + '</span>' +
        '</label>' +
        '<p class="sea-note">' + esc(t('cert.insConfirmHelp')) + '</p>' +
      '</div>';
    }
    if (v.type !== 'sea') return '';
    const miss = TriArk.certs.missingOf(v);
    return '<div class="sea-box">' +
      '<p class="sea-head">' + esc(t('sea.title')) +
        '<span class="sea-state ' + (miss.length ? 'todo' : 'done') + '">' +
          esc(t(miss.length ? 'sea.todo' : 'sea.done')) + '</span></p>' +
      '<div class="sea-row">' +
        '<select data-f="seaBizKind">' +
          '<option value=""' + (!v.seaBizKind ? ' selected' : '') + '>' + esc(t('sea.pickBiz')) + '</option>' +
          TriArk.certs.SEA_BIZ.map(k => '<option value="' + k + '"' +
            (v.seaBizKind === k ? ' selected' : '') + '>' + esc(t('cert.k.' + k)) + '</option>').join('') +
        '</select>' +
        '<input type="text" data-f="seaBizNo" maxlength="60" value="' + esc(v.seaBizNo || '') + '"' +
          ' placeholder="' + esc(t('sea.bizNoPh')) + '">' +
      '</div>' +
      '<div class="sea-row">' +
        '<span class="sea-label">' + esc(t('cert.k.boatTokutei')) + '</span>' +
        '<input type="text" data-f="seaLicNo" maxlength="60" value="' + esc(v.seaLicNo || '') + '"' +
          ' placeholder="' + esc(t('sea.licNoPh')) + '">' +
      '</div>' +
      '<label class="sea-check">' +
        '<input type="checkbox" data-f="seaInsOk"' + (v.seaInsOk ? ' checked' : '') + '>' +
        '<span>' + esc(t('sea.ins')) + '</span>' +
      '</label>' +
      '<p class="sea-note">' + esc(t('sea.note')) + '</p>' +
    '</div>';
  }

  function renderVehicles() {
    const box = el('vehList');
    box.innerHTML = vehicles.map((v, i) =>
      '<div class="veh" data-i="' + i + '">' +
        '<div class="veh-head">' +
          '<select data-f="type">' + VEH_TYPES.map(k =>
            '<option value="' + k + '"' + (v.type === k ? ' selected' : '') + '>' +
            esc(t('listing.type.' + k)) + '</option>').join('') + '</select>' +
          '<input type="text" data-f="name" maxlength="40" value="' + esc(v.name || '') + '" placeholder="' + esc(t('veh.namePh.' + (v.type || 'land'))) + '">' +
          '<button type="button" class="rm" aria-label="remove">×</button>' +
        '</div>' +
        '<textarea data-f="note" maxlength="200" placeholder="' + esc(t('veh.notePh.' + (v.type || 'land'))) + '">' + esc(v.note || '') + '</textarea>' +
        arkBox(v) +
        '<div class="ph-grid">' + photoGrid(v.photos || []) + '</div>' +
        '<label class="photo-btn" for="vehFile' + i + '">' + esc(t('veh.addPhotos')) + '</label>' +
        '<input type="file" id="vehFile' + i + '" accept="image/*" multiple hidden>' +
      '</div>'
    ).join('');

    box.querySelectorAll('.veh').forEach(row => {
      const i = parseInt(row.dataset.i, 10);
      row.querySelectorAll('[data-f]').forEach(inp => {
        const f = inp.dataset.f;
        const put = () => {
          vehicles[i][f] = (inp.type === 'checkbox') ? inp.checked : inp.value;
          /* 種類を変えたら箱ごと作り直す（海なら登録の欄が出る）。
             登録の中身を打っている間は、揃ったかどうかの札だけ差し替える
             （作り直すと入力中のカーソルが飛ぶため） */
          if (f === 'type') renderVehicles();
          else if (f.indexOf('sea') === 0) refreshSeaState(row, vehicles[i]);
        };
        inp.addEventListener('change', put);
        inp.addEventListener('input',  put);
      });
      row.querySelector('.rm').addEventListener('click', () => { vehicles.splice(i, 1); renderVehicles(); });
      row.querySelectorAll('.ph button').forEach(b => b.addEventListener('click', () => {
        vehicles[i].photos.splice(parseInt(b.dataset.i, 10), 1); renderVehicles();
      }));
      row.querySelector('input[type=file]').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files); e.target.value = '';
        await takePhotos(files, vehicles[i].photos, VEH_PHOTOS, renderVehicles);
      });
    });
    el('vehAdd').classList.toggle('hidden', vehicles.length >= VEH_MAX);
  }

  /* 打っているそばから「揃いました」に変える */
  function refreshSeaState(row, v) {
    const tag = row.querySelector('.sea-state');
    if (!tag) return;
    const miss = TriArk.certs.missingOf(v);
    tag.className = 'sea-state ' + (miss.length ? 'todo' : 'done');
    tag.textContent = t(miss.length ? 'sea.todo' : 'sea.done');
  }

  /* 共通の写真。体験の編集画面と同じ形にして、ホストが迷わないようにする */
  function renderGallery() {
    el('galGrid').innerHTML = gallery.map((u, i) =>
      '<div class="ph-item">' +
        '<div class="ph" data-full="' + esc(u) + '">' +
          '<img src="' + esc(u) + '" alt="" loading="lazy">' +
          '<button type="button" data-i="' + i + '" aria-label="remove">×</button>' +
        '</div>' +
        '<input type="text" class="ph-note" data-i="' + i + '" maxlength="' + NOTE_LEN + '"' +
          ' value="' + esc(galNotes[i] || '') + '"' +
          ' placeholder="' + esc(t('listing.photoNote')) + '">' +
      '</div>').join('');

    el('galGrid').querySelectorAll('.ph button').forEach(b =>
      b.addEventListener('click', () => {
        const i = parseInt(b.dataset.i, 10);
        gallery.splice(i, 1);
        galNotes.splice(i, 1);      // 写真と一言は、必ず同じ並びに保つ
        renderGallery();
      }));

    el('galGrid').querySelectorAll('input.ph-note').forEach(inp =>
      inp.addEventListener('input', () => {
        galNotes[parseInt(inp.dataset.i, 10)] = inp.value;
      }));
  }

  /* 画面にある一言を控えに取り込む（保存の直前に呼ぶ） */
  function collectGalNotes() {
    el('galGrid').querySelectorAll('input.ph-note').forEach(inp => {
      galNotes[parseInt(inp.dataset.i, 10)] = inp.value;
    });
    galNotes.length = gallery.length;
    return gallery.map((_, i) => String(galNotes[i] || '').trim().slice(0, NOTE_LEN));
  }

  el('galFile').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files); e.target.value = '';
    const before = gallery.length;
    await takePhotos(files, gallery, GAL_MAX, renderGallery);
    // 増えたぶんだけ、空の一言を足しておく
    while (galNotes.length < gallery.length) galNotes.push('');
    if (gallery.length !== before) renderGallery();
  });

  el('vehAdd').addEventListener('click', () => {
    if (vehicles.length >= VEH_MAX) return;
    vehicles.push({ type: 'land', name: '', note: '', photos: [],
                    seaBizKind: '', seaBizNo: '', seaLicNo: '', seaInsOk: false,
                    carInsOk: false });
    renderVehicles();
  });

  /* ============================================================
     編集：ホストの欄
     ============================================================ */
  function setHostOpen(open) {
    hostOpen = open;
    el('hostSec').classList.toggle('hidden', !open);
    el('hostInvite').classList.toggle('hidden', open);
    TriArk.limits.refresh();
  }
  el('openHost').addEventListener('click', () => {
    setHostOpen(true);
    el('hostSec').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  /* ============================================================
     編集：読み込み
     以前の形（日本語欄と英語欄が別）のデータも読めるようにしておく。
     日本語欄が空で英語欄だけ書いてあれば、英語のほうを入れる。
     ============================================================ */
  const legacy = (d, f) => (d[f] && String(d[f]).trim()) ? d[f] : (d[f + '_en'] || '');

  async function loadIntoForm(uid) {
    const [userSnap, hostSnap] = await Promise.all([
      getDoc(doc(db, 'users', uid)),
      getDoc(doc(db, 'hosts', uid))
    ]);
    const u = userSnap.exists() ? userSnap.data() : {};
    const h = hostSnap.exists() ? hostSnap.data() : {};

    el('name').value = u.name || '';
    // 以前の「もっと具体的に」は、自己紹介の後ろにつなげて一つにする
    const bio  = legacy(u, 'bio');
    const free = legacy(u, 'interestsFree');
    el('bio').value = [bio, free].filter(Boolean).join('\n\n');

    photoURL = u.photoURL || '';
    paintAvatar(el('avatarPreview'), photoURL, u.name);
    el('photoRemove').classList.toggle('hidden', !photoURL);
    el('photoBtn').textContent = t(photoURL ? 'profile.photoChange' : 'profile.photoPick');

    buildLangChecks(u.languages || h.languages);
    buildInterests(u.interests || []);
    tags = Array.isArray(u.tags) ? u.tags.slice(0, TAG_MAX) : [];
    renderTags();

    vehicles = Array.isArray(h.vehicles) ? h.vehicles.map(v => ({
      type: v.type || 'land', name: v.name || '', note: v.note || '',
      photos: Array.isArray(v.photos) ? v.photos.slice(0, VEH_PHOTOS) : [],
      seaBizKind: v.seaBizKind || '', seaBizNo: v.seaBizNo || '',
      seaLicNo  : v.seaLicNo   || '', seaInsOk : !!v.seaInsOk,
      carInsOk  : !!v.carInsOk
    })).slice(0, VEH_MAX) : [];

    // 写真と一言は対で読む。片方だけ間引くと並びがずれる
    const rawGal   = Array.isArray(h.gallery)      ? h.gallery      : [];
    const rawNotes = Array.isArray(h.galleryNotes) ? h.galleryNotes : [];
    gallery = []; galNotes = [];
    rawGal.forEach((u, i) => {
      if (!u || gallery.length >= GAL_MAX) return;
      gallery.push(u);
      galNotes.push(String(rawNotes[i] || ''));
    });


    renderVehicles();
    renderGallery();

    el('headline').value = legacy(h, 'headline');
    el('basedIn').value  = legacy(h, 'basedIn');
    el('intro').value    = legacy(h, 'intro');

    wasHost = !!u.isHost;
    setHostOpen(wasHost || wantHost);
    TriArk.limits.refresh();

    buildTrLangs(u.srcLang || h.srcLang);
    loadTranslations().catch(e => console.warn('[profile] 翻訳の読み込みに失敗', e));
  }

  /* ============================================================
     編集：保存
     ============================================================ */
  async function save() {
    const user = getUser();
    if (!user) return;
    addTag(el('tagInput').value); el('tagInput').value = '';
    if (!TriArk.limits.check()) { message('limit.over', 'error'); return; }

    const name = el('name').value.trim();
    if (!name) { message('profile.needName', 'error'); el('name').focus(); return; }

    el('saveBtn').disabled = true;
    message('auth.processing', 'info');

    try {
      // 1. 写真（選び直したときだけ）。
      //    毎回別の名前で保存するので、ブラウザに古い写真が残って見えることがない
      if (photoBlob) {
        const path = 'users/' + user.uid + '/avatar-' + Date.now() + '.jpg';
        const r = storageRef(storage, path);
        try {
          await uploadBytes(r, photoBlob, { contentType: 'image/jpeg' });
          photoURL = await getDownloadURL(r);
        } catch (e) {
          console.error('[profile] 写真のアップロードに失敗', e);
          message('profile.photoFailed', 'error');
          el('saveBtn').disabled = false;
          return;
        }
        photoBlob = null;
      }

      // 2. 人そのものの情報（ゲストもホストも）
      const languages = {}, languageCodes = [];
      el('langChecks').querySelectorAll('input[data-role=on]:checked').forEach(cb => {
        languages[cb.value] = el('langChecks').querySelector('select[data-level="' + cb.value + '"]').value;
        languageCodes.push(cb.value);
      });
      const interests = Array.from(el('interestChips').querySelectorAll('.chip.on')).map(b => b.dataset.code);

      await updateDoc(doc(db, 'users', user.uid), {
        name, photoURL,
        bio: el('bio').value.trim(),
        languages, languageCodes, interests, tags,
        isHost: hostOpen || wasHost,
        // 以前の形の欄は、新しい欄に移したので消す
        bio_en: deleteField(),
        interestsFree: deleteField(),
        interestsFree_en: deleteField(),
        updatedAt: serverTimestamp()
      });

      // 3. ホストとしての紹介（欄を開いているときだけ）
      if (hostOpen) {
        const ref = doc(db, 'hosts', user.uid);
        const snap = await getDoc(ref);
        const data = {
          headline: el('headline').value.trim(),
          basedIn : el('basedIn').value.trim(),
          intro   : el('intro').value.trim(),
          vehicles: vehicles
            .filter(v => v.name || (v.photos && v.photos.length))
            .map(v => ({
              type: v.type || 'land', name: (v.name || '').trim(),
              note: (v.note || '').trim(), photos: v.photos || [],
              /* 海のときだけ意味のある欄。陸に戻したときは空にして、
                 使っていない登録番号が残らないようにする */
              seaBizKind: v.type === 'sea' ? (v.seaBizKind || '') : '',
              seaBizNo  : v.type === 'sea' ? String(v.seaBizNo || '').trim().slice(0, 60) : '',
              seaLicNo  : v.type === 'sea' ? String(v.seaLicNo || '').trim().slice(0, 60) : '',
              seaInsOk  : v.type === 'sea'  ? !!v.seaInsOk : false,
              carInsOk  : v.type === 'land' ? !!v.carInsOk : false
            })),
          gallery      : gallery,
          galleryNotes : collectGalNotes(),
          headline_en: deleteField(),
          basedIn_en : deleteField(),
          intro_en   : deleteField(),
          updatedAt: serverTimestamp()
        };
        if (!snap.exists()) { data.hostSince = serverTimestamp(); data.createdAt = serverTimestamp(); }
        await setDoc(ref, data, { merge: true });
        wasHost = true;
      }

      el('photoNote').classList.add('hidden');
      el('photoBtn').textContent = t(photoURL ? 'profile.photoChange' : 'profile.photoPick');
      message('host.saved', 'ok');
      setTimeout(loadTranslations, 6000);   // 翻訳が書き戻されるのを待つ
    } catch (e) {
      console.error(e);
      message('host.saveFailed', 'error');
    } finally {
      el('saveBtn').disabled = false;
    }
  }
  el('saveBtn').addEventListener('click', save);

  /* ============================================================
     翻訳の確認
     文章を保存すると、サーバー側の関数が自動で翻訳して書き戻す。
     ここでは、その結果を言語を選んで読めるようにしている。
     （数十秒かかることがあるので「最新にする」で読み直せる）
     ============================================================ */
  const TR_TEXT = [['bio','profile.bio'],['headline','host.headline'],['basedIn','host.basedIn'],['intro','host.intro']];
  const TR_HOST = ['headline', 'basedIn', 'intro'];   // hosts の書類に入る欄

  async function loadTranslations() {
    const user = getUser();
    if (!user) return;
    const lang = el('trLang').value;
    const [userSnap, hostSnap] = await Promise.all([
      getDoc(doc(db, 'users', user.uid)),
      getDoc(doc(db, 'hosts', user.uid))
    ]);
    const u = userSnap.exists() ? userSnap.data() : {};
    const h = hostSnap.exists() ? hostSnap.data() : {};
    const got = {};
    if (u.tr && u.tr[lang]) Object.assign(got, u.tr[lang]);
    if (h.tr && h.tr[lang]) Object.assign(got, h.tr[lang]);

    /* 自動翻訳の結果を、そのまま直せる形で出す。
       日本語にしかない言い回しは機械が苦手なので、本人が直せた方がいい */
    let html = TR_TEXT.filter(([f]) => got[f]).map(([f, key]) =>
      '<div class="tr-item">' +
        '<p class="k">' + esc(t(key)) + '</p>' +
        '<textarea data-f="' + f + '">' + esc(got[f]) + '</textarea>' +
      '</div>'
    ).join('');
    if (Array.isArray(got.tags) && got.tags.length) {
      html += '<div class="tr-item"><p class="k">' + esc(t('interests.label')) + '</p>' +
              '<div class="tr-tags">' + got.tags.map((x, i) =>
                '<input type="text" data-tag="' + i + '" value="' + esc(x) + '">').join('') +
              '</div></div>';
    }
    el('trBody').innerHTML = html || '<p class="tr-empty">' + esc(t('profile.trPending')) + '</p>';
    el('trFoot').classList.toggle('hidden', !html);
  }

  /* 直した訳を保存する。
     元の文章には触らないので、自動翻訳がこれを上書きすることはない。
     （上書きが起きるのは、元の文章を書き直して保存したときだけ） */
  async function saveTranslations() {
    const user = getUser();
    if (!user) return;
    const lang = el('trLang').value;
    const uPatch = {}, hPatch = {};

    el('trBody').querySelectorAll('textarea[data-f]').forEach(inp => {
      const f = inp.dataset.f;
      const box = TR_HOST.indexOf(f) !== -1 ? hPatch : uPatch;
      box['tr.' + lang + '.' + f] = inp.value.trim();
    });
    const tagInputs = el('trBody').querySelectorAll('input[data-tag]');
    if (tagInputs.length) {
      uPatch['tr.' + lang + '.tags'] =
        Array.prototype.map.call(tagInputs, i => i.value.trim()).filter(Boolean);
    }

    el('trSave').disabled = true;
    message('profile.trSaving', 'info');
    try {
      if (Object.keys(uPatch).length) await updateDoc(doc(db, 'users', user.uid), uPatch);
      if (Object.keys(hPatch).length) await updateDoc(doc(db, 'hosts', user.uid), hPatch);
      message('profile.trSaved', 'ok');
    } catch (e) {
      console.error('[profile] 訳の保存に失敗', e);
      message('profile.trFailed', 'error');
    } finally {
      el('trSave').disabled = false;
    }
  }
  el('trSave').addEventListener('click', saveTranslations);

  function buildTrLangs(srcLang) {
    const others = TriArk.i18n.langs.filter(l => l !== (srcLang || TriArk.i18n.get()));
    el('trLang').innerHTML = others.map(l =>
      '<option value="' + l + '">' + esc(t('lang.' + l)) + '</option>').join('');
  }
  el('trLang').addEventListener('change', loadTranslations);
  el('trReload').addEventListener('click', loadTranslations);

  /* ============================================================
     閲覧
     文章は TriArk.i18n.pick() で取り出す。
     翻訳が用意されていれば（次の段階で追加）見る人の言語で、
     無ければ書いた人の言葉のまま表示される。
     ============================================================ */
  async function renderView(uid) {
    const [userSnap, hostSnap] = await Promise.all([
      getDoc(doc(db, 'users', uid)),
      getDoc(doc(db, 'hosts', uid))
    ]);
    if (!userSnap.exists()) { show('notFound'); return; }

    const u = userSnap.data();
    const h = hostSnap.exists() ? hostSnap.data() : null;
    const isHost = !!u.isHost && !!h;

    paintAvatar(el('vAvatar'), u.photoURL, u.name);
    el('vRole').textContent = isHost ? 'HOST' : 'TRAVELER';
    el('viewName').textContent = u.name || '';

    const headline = h ? TriArk.i18n.pick(h, 'headline').text : '';
    el('viewHeadline').textContent = headline || '';
    el('viewHeadline').classList.toggle('hidden', !headline);

    const based = TriArk.i18n.basedLine(h ? TriArk.i18n.pick(h, 'basedIn').text : '');
    const langNames = TriArk.i18n.langLine(toLangMap(u.languages));
    el('viewMeta').textContent = [based, langNames].filter(Boolean).join('　·　');

    const own = TriArk.i18n.pickList ? TriArk.i18n.pickList(u, 'tags') : (u.tags || []);
    el('viewTags').innerHTML =
      (u.interests || []).map(c => '<span>' + esc(t('interest.' + c)) + '</span>').join('') +
      own.map(x => '<span class="own">' + esc(x) + '</span>').join('');

    // 見出しは「○○さんの Ark」。ゲストが読む場所なので、名前を主語にする
    const firstName = String(u.name || '').trim().split(/[\s\u3000]+/)[0] || '';
    el('vehHead').textContent = t('veh.of').replace('{name}', firstName);
    el('listHead').textContent = firstName
      ? t('host.listingsOf').replace('{name}', firstName) : t('host.listings');

    // Ark と旅の写真（体験ページからも同じものを参照する）
    const vehs = h ? TriArk.i18n.pickObjList(h, 'vehicles', ['name', 'note']) : [];
    /* 写真は3枚だけ並べ、4枚目からは「すべての写真を表示」で開く。
       中途半端に2段目が欠けて並ぶと寂しく見えるため */
    const tile = (p) => '<div class="ph" data-full="' + esc(p) + '"><img src="' + esc(p) + '" alt="" loading="lazy">';
    el('vehView').innerHTML = vehs.map((v, vi) => {
      const ps   = (v.photos || []).filter(Boolean);
      const head = ps.slice(0, 3);
      const rest = ps.slice(3);
      return '<div class="v-veh">' +
        '<p class="k">' + esc(t('listing.type.' + (v.type || 'land'))) + '</p>' +
        '<p class="n">' + esc(v.name || '') + '</p>' +
        (v.note ? '<p class="note">' + esc(v.note) + '</p>' : '') +
        '<div class="ph-grid">' + head.map((p, i) =>
          tile(p) +
          ((rest.length && i === head.length - 1)
            ? '<button type="button" class="more" data-veh="' + vi + '">' + esc(t('detail.allPhotos')) + '</button>'
            : '') + '</div>').join('') + '</div>' +
        (rest.length
          ? '<div class="ph-grid hidden" data-rest="' + vi + '">' +
              rest.map(p => tile(p) + '</div>').join('') + '</div>'
          : '') +
      '</div>';
    }).join('');
    el('vehView').querySelectorAll('button.more').forEach(b =>
      b.addEventListener('click', () => {
        const box = el('vehView').querySelector('[data-rest="' + b.dataset.veh + '"]');
        if (box) box.classList.remove('hidden');
        b.remove();
      }));
    el('vehSec').classList.toggle('hidden', !vehs.length);

    /* 船の登録。番号は固有名詞なので訳さず、見出しだけ訳す。
       どの船のものかがわかるように、右端に Ark の名前を出す */
    const raw = (h && Array.isArray(h.vehicles)) ? h.vehicles : [];
    const rows = [];
    raw.forEach((v, n) => {
      if (!v || v.type !== 'sea') return;
      const nm = (vehs[n] && vehs[n].name) || v.name || '';
      if (v.seaBizKind && v.seaBizNo) rows.push([t('cert.k.' + v.seaBizKind), v.seaBizNo, nm]);
      if (v.seaLicNo)                 rows.push([t('cert.k.boatTokutei'),     v.seaLicNo, nm]);
      if (v.seaInsOk)                 rows.push([t('cert.k.insBoat'),         t('sea.insShort'), nm]);
    });
    raw.forEach((v, n) => {
      if (!v || v.type !== 'land' || !v.carInsOk) return;
      rows.push([t('cert.insConfirmedLabel'), '', (vehs[n] && vehs[n].name) || v.name || '']);
    });

    el('certView').innerHTML = rows.map(r =>
      '<div class="v-cert">' +
        '<span class="k">' + esc(r[0]) + '</span>' +
        (r[1] ? '<span class="no">' + esc(r[1]) + '</span>' : '') +
        (r[2] ? '<span class="exp">' + esc(r[2]) + '</span>' : '') +
      '</div>').join('');
    el('certSec').classList.toggle('hidden', !rows.length);

    const intro = h ? TriArk.i18n.pick(h, 'intro') : { text: '' };
    el('viewIntro').textContent = intro.text || '';
    el('introSec').classList.toggle('hidden', !isHost || !intro.text);
    el('introNote').classList.toggle('hidden', !intro.isFallback);
    if (intro.isFallback) el('introNote').textContent = t(TriArk.i18n.get() === 'en' ? 'common.jaOnly' : 'common.enOnly');

    const bio = TriArk.i18n.pick(u, 'bio').text;
    el('viewBio').textContent = bio || '';
    el('bioSec').classList.toggle('hidden', !bio);

    const free = TriArk.i18n.pick(u, 'interestsFree').text;
    el('viewFree').textContent = free || '';
    el('freeSec').classList.toggle('hidden', !free);

    if (isHost) await renderHostListings(uid);
    else el('viewListings').classList.add('hidden');
    // 目次は、中身を出したあとで作る。
    // 隠れているうちは、どの欄も画面の位置が 0 と返ってくるので、
    // 「いま見ている欄」を正しく決められない
    show('viewMode');
    buildSideNav();
  }

  /* ------------------------------------------------------------
     左の余白に出す目次
     ・出ている欄だけを並べる
     ・見出しの文字をそのまま使うので、言語を変えても中身とずれない
     ・押すと、その欄まで画面が動く
     ------------------------------------------------------------ */
  let navScroll = null;

  function buildSideNav() {
    const nav = el('sideNav');
    if (!nav) return;
    if (navScroll) { window.removeEventListener('scroll', navScroll); navScroll = null; }

    const items = [
      ['viewListings', 'listHead'],
      ['vehSec',       'vehHead'],
      ['certSec',      'certHead']
    ].filter(([sec]) => {
      const s = el(sec);
      return s && !s.classList.contains('hidden');
    });

    // 1つしかないときは、目次にする意味がない
    nav.classList.toggle('hidden', items.length < 2);
    if (items.length < 2) { nav.innerHTML = ''; return; }

    nav.innerHTML = items.map(([sec, head]) =>
      '<a href="#' + sec + '" data-sec="' + sec + '">' +
        esc((el(head) && el(head).textContent) || '') + '</a>').join('');

    /* 押された欄は、その場で印を移す。
       画面が動き終わるまで待つと、指を離してから一呼吸おいて色が変わり、
       押したことが伝わらない。動いている間は、この印を優先する */
    let picked = null, pickTimer = null;

    const atBottom = () =>
      window.innerHeight + window.scrollY >=
      (document.documentElement.scrollHeight || document.body.scrollHeight) - 4;

    nav.querySelectorAll('a').forEach(a =>
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const s = el(a.dataset.sec);
        if (!s) return;
        picked = a.dataset.sec;
        clearTimeout(pickTimer);
        pickTimer = setTimeout(() => { picked = null; mark(); }, 1000);
        s.scrollIntoView({ behavior: 'smooth', block: 'start' });
        mark();
      }));

    // いま見ている欄に印を付ける。
    // まだ下りていないときは、いちばん上の欄（体験）に印を付けておく
    const mark = () => {
      let on = items[0][0];
      if (picked) {
        on = picked;
      } else if (atBottom()) {
        /* いちばん下の欄は、画面の上まで来られないことがある。
           （その下に中身が無いので、それ以上ページが動かない）
           いちばん下まで来ているなら、最後の欄を見ているとみなす */
        on = items[items.length - 1][0];
      } else {
        items.forEach(([sec]) => {
          const s = el(sec);
          if (!s || !s.offsetHeight) return;   // まだ画面に出ていない欄は数えない
          if (s.getBoundingClientRect().top <= 140) on = sec;
        });
      }
      nav.querySelectorAll('a').forEach(a =>
        a.classList.toggle('on', a.dataset.sec === on));
    };
    navScroll = mark;
    window.addEventListener('scroll', navScroll, { passive: true });
    mark();
  }

  async function renderHostListings(uid) {
    let items = [];
    try {
      const snap = await getDocs(query(collection(db, 'listings'),
        where('hostId', '==', uid), where('status', '==', 'published')));
      items = snap.docs.map(d => ({ id: d.id, data: d.data() }));
    } catch (e) { console.error(e); }

    if (!items.length) { el('viewListings').classList.add('hidden'); return; }
    const lang = TriArk.i18n.get();
    el('viewListingCards').innerHTML = items.map(i => {
      const d = i.data;
      const title = TriArk.i18n.pick(d, 'title').text || '';
      const area  = TriArk.i18n.pick(d, 'area').text || '';
      const img   = (d.images && d.images[0]) ? d.images[0] : '';
      const fee   = d.price ? TriArk.i18n.money(d.price, d.currency, lang) : '';
      const meta  = [area, fee ? t('listing.fee') + ' ' + fee : ''].filter(Boolean).join('　·　');
      return '<a class="mini-card" href="listing.html?id=' + i.id + '&lang=' + lang + '">' +
        '<div class="mc-img"' + (img ? ' style="background-image:url(\'' + esc(img) + '\')"' : '') + '></div>' +
        '<div><p class="mc-title">' + esc(title) + '</p><p class="mc-meta">' + esc(meta) + '</p></div></a>';
    }).join('');
    el('viewListings').classList.remove('hidden');
  }

  /* ============================================================
     起動
     ============================================================ */
  onUser(async ({ user }) => {
    if (viewUid) {
      await renderView(viewUid);
      if (user && viewUid === user.uid) {
        el('editMine').href = 'profile.html?lang=' + TriArk.i18n.get();
        el('editMine').classList.remove('hidden');
      }
      return;
    }
    if (!user) {
      const next = 'profile.html' + (wantHost ? '?host=1' : '');
      location.href = 'login.html?mode=signup&next=' + encodeURIComponent(next) + '&lang=' + TriArk.i18n.get();
      return;
    }
    show('editMode');
    el('viewMine').href = 'profile.html?uid=' + user.uid + '&lang=' + TriArk.i18n.get();
    el('signOutBtn').onclick = async () => {
      await logOut();
      location.href = 'index.html?lang=' + TriArk.i18n.get();
    };
    try { await loadIntoForm(user.uid); }
    catch (e) { console.error(e); buildLangChecks({}); buildInterests([]); }
  });

  TriArk.i18n.onChange(() => {
    if (viewUid && !el('viewMode').classList.contains('hidden')) renderView(viewUid);
    if (!el('editMode').classList.contains('hidden')) {
      renderTags();
      el('photoBtn').textContent = t(photoURL || photoBlob ? 'profile.photoChange' : 'profile.photoPick');
    }
  });
</script>
<script src="trial.js"></script>
<script src="tabbar.js"></script>
</body>
